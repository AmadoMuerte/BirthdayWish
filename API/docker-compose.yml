version: "3.8"

services:
  auth-db:
    image: postgres:alpine
    restart: always
    shm_size: 128mb
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_service
    ports:
      - "5433:5432"
    networks:
      - db_network
  wish-db:
    image: postgres:alpine
    restart: always
    shm_size: 128mb
    volumes:
      - wish_db_data:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wish_service
    ports:
      - "5434:5432"
    networks:
      - db_network

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    depends_on:
      - db
      - auth-db
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - db_network

volumes:
  auth_db_data:
  wish_db_data:
  minio_data:
  redis_data:

networks:
  app_network:
    driver: bridge
  db_network:
    driver: bridge