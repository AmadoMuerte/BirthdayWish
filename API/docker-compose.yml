services:
  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_service
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - birthdaywish
  wish-db:
    image: postgres:17-alpine
    container_name: wish-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wish_service
    ports:
      - "5434:5432"
    volumes:
      - wish_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - birthdaywish

  gateway-service:
    build:
      dockerfile: apps/gateway/Dockerfile
    container_name: gateway-service
    ports:
      - "3030:3030"
    restart: unless-stopped
    networks:
      - birthdaywish

  auth-service:
    build:
      dockerfile: apps/auth/Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:50051"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - birthdaywish

  wishlister-service:
    build:
      dockerfile: apps/wishlister/Dockerfile
    container_name: wishlister-service
    ports:
      - "${WISHLISTER_SERVICE_PORT}:50052"
    depends_on:
      wish-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - birthdaywish
networks:
  birthdaywish:
    driver: bridge

volumes:
  auth_db_data:
    driver: local
  wish_db_data:
    driver: local